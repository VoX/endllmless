<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142d4c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef3f8" media="(prefers-color-scheme: light)" />
    <meta
      name="endllmless"
      content="craft endlessly"
    />
    <link rel="manifest" href="/manifest.json" />

    <title>EndLLMless</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong theme (FOUC).
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
